name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: markdown
    attributes:
      value: Never attach profiles, credentials, cookies, or private page content.
  - type: input
    id: version
    attributes:
      label: PBB version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 10, Windows 11, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

