name: Feature request
description: Propose a focused, safe improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent workflow is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This request does not bypass CAPTCHA, authentication, anti-bot controls, or authorization.
          required: true

