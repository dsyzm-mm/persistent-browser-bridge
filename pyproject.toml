[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "persistent-browser-bridge"
version = "0.1.0"
description = "Give AI coding agents a real persistent browser."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Persistent Browser Bridge contributors" }]
keywords = ["ai-agents", "browser-automation", "playwright", "persistent-profile"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5",
  "playwright>=1.48,<2",
  "psutil>=6,<8",
  "pydantic>=2.9,<3",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-psutil>=6,<8",
]

[project.scripts]
pbb = "pbb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pbb"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

